#
# A two-agent triage workflow. Neither agent is deployed anywhere: both are declared with
# [FoundryAgent] and resolved by name through Foundry's agent factory, which is what lets this
# run offline.
#
# Agents are addressed by fully-qualified type name because that is what
# IAgentFactory.CreateAgent(string) currently matches on.
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: triage_workflow
  actions:

    - kind: SetVariable
      id: capture_report
      displayName: Capture the incoming report
      variable: Local.report
      value: =System.LastMessage.Text

    - kind: InvokeAzureAgent
      id: classify
      displayName: Classify the report
      agent:
        name: DeclarativeWorkflowApp.ClassifierAgent
      input:
        messages: =Local.report
      output:
        autoSend: true
        responseObject: Local.Classification

    - kind: InvokeAzureAgent
      id: respond
      displayName: Draft a response
      agent:
        name: DeclarativeWorkflowApp.ResponderAgent
      input:
        messages: =Local.report
      output:
        autoSend: true
        responseObject: Local.Response
