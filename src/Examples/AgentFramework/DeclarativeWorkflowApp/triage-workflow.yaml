#
# A two-agent triage workflow. Neither agent is deployed anywhere: both are ordinary in-process
# agents resolved by name through Foundry's agent registry, which is what lets this run offline.
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: triage_workflow
  actions:

    - kind: SetVariable
      id: capture_report
      displayName: Capture the incoming report
      variable: Local.report
      value: =System.LastMessage.Text

    - kind: InvokeAzureAgent
      id: classify
      displayName: Classify the report
      agent:
        name: Classifier
      input:
        messages: =Local.report
      output:
        autoSend: true
        responseObject: Local.Classification

    - kind: InvokeAzureAgent
      id: respond
      displayName: Draft a response
      agent:
        name: Responder
      input:
        messages: =Local.report
      output:
        autoSend: true
        responseObject: Local.Response
