#
# A two-agent triage workflow. Neither agent is deployed anywhere: both are declared with
# [FoundryAgent] and resolved through Foundry's agent factory, which is what lets this run
# offline.
#
# Agents are addressed by their published name. ClassifierAgent does not declare one, so its
# class name is used. ResponderAgent declares [FoundryAgent(Name = "Responder")], so it is
# addressed as "Responder" and its class can be renamed without editing this file.
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: triage_workflow
  actions:

    - kind: SetVariable
      id: capture_report
      displayName: Capture the incoming report
      variable: Local.report
      value: =System.LastMessage.Text

    - kind: InvokeAzureAgent
      id: classify
      displayName: Classify the report
      agent:
        name: ClassifierAgent
      input:
        messages: =Local.report
      output:
        autoSend: true
        responseObject: Local.Classification

    - kind: InvokeAzureAgent
      id: respond
      displayName: Draft a response
      agent:
        name: Responder
      input:
        messages: =Local.report
      output:
        autoSend: true
        responseObject: Local.Response
