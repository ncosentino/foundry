name: Runner Image

on:
  pull_request:
    paths:
      - global.json
      - .github/dotnet/sdk-9/global.json
      - .github/runner-images/foundry-ci/Dockerfile
      - .github/workflows/runner-image.yml
      - scripts/test-runner-image.ps1
  push:
    branches:
      - main
    paths:
      - global.json
      - .github/dotnet/sdk-9/global.json
      - .github/runner-images/foundry-ci/Dockerfile
      - .github/workflows/runner-image.yml
      - scripts/test-runner-image.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/foundry-runner

jobs:
  contract:
    name: runner-image-contract
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runner image contract
        shell: pwsh
        run: scripts/test-runner-image.ps1 -SelfTest

  validate:
    name: validate-runner-image
    needs: contract
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .github/runner-images/foundry-ci
          file: .github/runner-images/foundry-ci/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: foundry-runner:validation
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Execute candidate image contract
        run: >-
          docker run
          --rm
          --platform linux/amd64
          --entrypoint /bin/bash
          foundry-runner:validation
          -lc
          "test -x /actions-runner/bin/Runner.Listener
          && dotnet --list-sdks | grep -F '9.0.316'
          && dotnet --list-sdks | grep -F '10.0.302'
          && clang --version
          && pwsh --version
          && git --version
          && gh --version"

  publish:
    name: publish-runner-image
    needs:
      - contract
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/runner-images/foundry-ci
          file: .github/runner-images/foundry-ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/foundry-runner:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Verify published manifest and record digest
        id: publication
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}"
          mkdir -p artifacts/runner-image
          printf '%s\n' "${DIGEST}" > artifacts/runner-image/manifest-digest.txt
          printf '%s\n' "${IMAGE}" > artifacts/runner-image/immutable-image.txt
          cat > artifacts/runner-image/publication.json <<EOF
          {
            "schemaVersion": "1.0",
            "sourceSha": "${GITHUB_SHA}",
            "tag": "${IMAGE_NAME}:sha-${GITHUB_SHA}",
            "digest": "${DIGEST}",
            "immutableImage": "${IMAGE}"
          }
          EOF
          {
            echo "## Foundry runner image"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Immutable tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo "- Manifest digest: \`${DIGEST}\`"
            echo "- Immutable image: \`${IMAGE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundry-runner-publication-${{ github.sha }}
          path: artifacts/runner-image
          if-no-files-found: error
          retention-days: 90
