name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_harness_evaluation:
        description: Run the hosted Harness evaluation preflight on the dispatched ref.
        required: true
        type: boolean
        default: false
      confirm_paid_models_quota:
        description: Confirm paid GitHub Models capacity can reserve the protocol worst case.
        required: true
        type: boolean
        default: false
      harness_model_id:
        description: GitHub Models generator model identifier.
        required: true
        type: string
        default: openai/gpt-4.1-mini

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test-pack:
    if: github.event_name != 'workflow_dispatch' || !inputs.run_harness_evaluation
    # PitCrew default. Set CI_RUNNER=ubuntu-latest for the manual cloud fallback.
    # Untrusted fork pull requests always use GitHub-hosted infrastructure.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || fromJSON('["self-hosted","linux","x64","general-purpose"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/NexusLabs.Foundry.slnx

      - name: Build
        run: dotnet build src/NexusLabs.Foundry.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          failed=0
          while IFS= read -r project; do
            echo "::group::Testing $(basename "$project")"
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --verbosity normal \
              --blame-hang \
              --blame-hang-dump-type none \
              --blame-hang-timeout 5m \
              --filter "Category!=Integration" || failed=1
            echo "::endgroup::"
          done < <(find src -name '*.Tests.csproj' | sort)
          exit $failed

      - name: Pack
        shell: bash
        env:
          GITHUB_ENV: /tmp/discard-pack-env
          GITHUB_OUTPUT: /tmp/discard-pack-output
          GITHUB_STEP_SUMMARY: /tmp/discard-pack-summary
        run: |
          mkdir -p artifacts/packages
          mapfile -t projects < <(find src -name 'NexusLabs.Foundry*.csproj' \
            ! -name '*.Tests.csproj' | sort)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::No Foundry package projects were found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output artifacts/packages
          done

      - name: Validate packages
        shell: pwsh
        run: scripts/validate-packages.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: foundry-packages
          path: artifacts/packages/*

  aot:
    if: github.event_name != 'workflow_dispatch' || !inputs.run_harness_evaluation
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || fromJSON('["self-hosted","linux","x64","general-purpose"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NativeAOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev file

      - name: Publish representative NativeAOT app
        env:
          GITHUB_ENV: /tmp/discard-aot-env
          GITHUB_OUTPUT: /tmp/discard-aot-output
          GITHUB_STEP_SUMMARY: /tmp/discard-aot-summary
        run: |
          dotnet publish src/Examples/AgentFramework/AotAgentFrameworkApp/AotAgentFrameworkApp.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output artifacts/aot

      - name: Verify NativeAOT executable
        run: |
          test -f artifacts/aot/AotAgentFrameworkApp
          file artifacts/aot/AotAgentFrameworkApp

      - name: Upload NativeAOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-aot-linux-x64
          path: artifacts/aot/AotAgentFrameworkApp

  aot-harness:
    if: github.event_name != 'workflow_dispatch' || !inputs.run_harness_evaluation
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || fromJSON('["self-hosted","linux","x64","general-purpose"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NativeAOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev file

      - name: Publish generated-tool Harness NativeAOT app
        env:
          GITHUB_ENV: /tmp/discard-aot-harness-env
          GITHUB_OUTPUT: /tmp/discard-aot-harness-output
          GITHUB_STEP_SUMMARY: /tmp/discard-aot-harness-summary
        run: |
          dotnet publish src/Examples/AgentFramework/AotHarnessApp/AotHarnessApp.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output artifacts/aot-harness

      - name: Execute generated-tool Harness NativeAOT app
        run: |
          test -f artifacts/aot-harness/AotHarnessApp
          file artifacts/aot-harness/AotHarnessApp
          artifacts/aot-harness/AotHarnessApp

      - name: Upload Harness NativeAOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-aot-harness-linux-x64
          path: artifacts/aot-harness/AotHarnessApp

  harness-evaluation-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.run_harness_evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      models: read
    env:
      MODEL_ID: ${{ inputs.harness_model_id }}
      PAID_QUOTA_CONFIRMED: ${{ inputs.confirm_paid_models_quota }}
      HARNESS_EVAL_PLANNED_RUNS: 72
      HARNESS_EVAL_MAX_ATTEMPTS: 144
      HARNESS_EVAL_MAX_REQUESTS_PER_ATTEMPT: 8
      HARNESS_EVAL_MAX_RESERVED_REQUESTS: 1152
      HARNESS_EVAL_WORKFLOW_TIMEOUT_MINUTES: 60
      HARNESS_EVAL_SCHEDULING_DEADLINE_MINUTES: 50
      HARNESS_EVAL_MAX_ATTEMPT_SECONDS: 120
      HARNESS_EVAL_MAX_OUTPUT_TOKENS: 2000
      HARNESS_EVAL_MIN_REQUEST_INTERVAL_MS: 4000
      HARNESS_EVAL_MAX_CONCURRENCY: 3
      HARNESS_EVAL_COST_CAP_USD: 25
      HARNESS_EVAL_ESTIMATED_USD_PER_REQUEST: 0.02
      HARNESS_EVAL_GLOBAL_SEED: 137
      HARNESS_EVAL_BATCH_ORDERING_SEED: 104729
      HARNESS_EVAL_ARM_ORDERING_SEED: 130363
      HARNESS_EVAL_BOOTSTRAP_SEED: 155921

    steps:
      - name: Checkout dispatched ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate deterministic evaluation contracts
        run: >-
          dotnet test
          src/NexusLabs.Foundry.Evaluation.Tests/NexusLabs.Foundry.Evaluation.Tests.csproj
          --configuration Release
          --filter
          "FullyQualifiedName~HarnessCaseSetManifestTests|FullyQualifiedName~HarnessCaseReferenceTests|FullyQualifiedName~HarnessJudgeCalibrationTests|FullyQualifiedName~HarnessComparison"
          --verbosity minimal

      - name: Run hosted quota and capture preflight
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $confirmPaidModelsQuota = $env:PAID_QUOTA_CONFIRMED -eq 'true'
          scripts/Invoke-HarnessEvaluationPreflight.ps1 `
            -OutputDirectory 'artifacts/eval/hosted-run' `
            -ModelId $env:MODEL_ID `
            -ConfirmPaidModelsQuota:$confirmPaidModelsQuota

      - name: Execute complete paired comparison
        if: env.PAID_QUOTA_CONFIRMED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_EVAL_MODEL_ID: ${{ env.MODEL_ID }}
        run: >-
          dotnet run
          --project src/Examples/AgentFramework/HarnessEvaluationApp/HarnessEvaluationApp.csproj
          --configuration Release
          --
          --output artifacts/eval/hosted-run

      - name: Upload immutable preflight bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/eval/hosted-run/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish non-gating summary
        if: always()
        shell: pwsh
        run: |
          $runStatusPath = 'artifacts/eval/hosted-run/run-status.json'
          $preflightStatusPath = 'artifacts/eval/hosted-run/preflight-status.json'
          $statusPath = if (Test-Path $runStatusPath) { $runStatusPath } else { $preflightStatusPath }
          "## Harness Evaluation Dispatch Bridge" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path $statusPath) {
            $status = Get-Content $statusPath -Raw | ConvertFrom-Json
            "- State: ``$($status.state)``" | Add-Content $env:GITHUB_STEP_SUMMARY
            "- Reason: $($status.reason)" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          else {
            "- State: ``Failed``" | Add-Content $env:GITHUB_STEP_SUMMARY
            "- Reason: preflight did not produce a status artifact" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          "- Advisory only: ``true``" | Add-Content $env:GITHUB_STEP_SUMMARY
