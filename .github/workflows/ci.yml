name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  guidance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate agent guidance
        shell: pwsh
        run: scripts/guidance/Test-Guidance.ps1 -SelfTest

  build-test-pack:
    needs: guidance
    # PitCrew default. Set CI_RUNNER=ubuntu-latest for the manual cloud fallback.
    # Untrusted fork pull requests always use GitHub-hosted infrastructure.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || fromJSON('["self-hosted","linux","x64","general-purpose"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup exact .NET SDKs
        uses: ./.github/actions/setup-dotnet
        with:
          global-json-files: global.json

      - name: Validate runner profile contract
        shell: pwsh
        run: scripts/test-runner-profile.ps1 -SelfTest

      - name: Restore
        run: dotnet restore src/NexusLabs.Foundry.slnx

      - name: Build
        run: dotnet build src/NexusLabs.Foundry.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          failed=0
          while IFS= read -r project; do
            echo "::group::Testing $(basename "$project")"
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --verbosity normal \
              --blame-hang \
              --blame-hang-dump-type none \
              --blame-hang-timeout 5m \
              --filter "Category!=Integration" || failed=1
            echo "::endgroup::"
          done < <(find src -name '*.Tests.csproj' | sort)
          exit $failed

      - name: Pack
        shell: bash
        env:
          GITHUB_ENV: /tmp/discard-pack-env
          GITHUB_OUTPUT: /tmp/discard-pack-output
          GITHUB_STEP_SUMMARY: /tmp/discard-pack-summary
        run: |
          mkdir -p artifacts/packages
          mapfile -t projects < <(find src -name 'NexusLabs.Foundry*.csproj' \
            ! -name '*.Tests.csproj' | sort)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::No Foundry package projects were found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output artifacts/packages
          done

      - name: Validate packages
        shell: pwsh
        run: scripts/validate-packages.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: foundry-packages
          path: artifacts/packages/*

  aot:
    needs: guidance
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || fromJSON('["self-hosted","linux","x64","general-purpose"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup exact .NET SDKs
        uses: ./.github/actions/setup-dotnet
        with:
          global-json-files: global.json

      - name: Install NativeAOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev file

      - name: Publish representative NativeAOT app
        env:
          GITHUB_ENV: /tmp/discard-aot-env
          GITHUB_OUTPUT: /tmp/discard-aot-output
          GITHUB_STEP_SUMMARY: /tmp/discard-aot-summary
        run: |
          dotnet publish src/Examples/AgentFramework/AotAgentFrameworkApp/AotAgentFrameworkApp.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output artifacts/aot
          dotnet publish src/Examples/Copilot/AotCopilotApp/AotCopilotApp.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output artifacts/aot-copilot

      - name: Verify NativeAOT executable
        run: |
          test -f artifacts/aot/AotAgentFrameworkApp
          file artifacts/aot/AotAgentFrameworkApp
          test -f artifacts/aot-copilot/AotCopilotApp
          file artifacts/aot-copilot/AotCopilotApp | grep -q 'ELF.*executable'
          artifacts/aot-copilot/AotCopilotApp

      - name: Upload NativeAOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-aot-linux-x64
          path: |
            artifacts/aot/AotAgentFrameworkApp
            artifacts/aot-copilot/AotCopilotApp

  aot-harness:
    needs: guidance
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || fromJSON('["self-hosted","linux","x64","general-purpose"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup exact .NET SDKs
        uses: ./.github/actions/setup-dotnet
        with:
          global-json-files: global.json

      - name: Install NativeAOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev file

      - name: Publish generated-tool Harness NativeAOT app
        env:
          GITHUB_ENV: /tmp/discard-aot-harness-env
          GITHUB_OUTPUT: /tmp/discard-aot-harness-output
          GITHUB_STEP_SUMMARY: /tmp/discard-aot-harness-summary
        run: |
          dotnet publish src/Examples/AgentFramework/AotHarnessApp/AotHarnessApp.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output artifacts/aot-harness

      - name: Execute generated-tool Harness NativeAOT app
        run: |
          test -f artifacts/aot-harness/AotHarnessApp
          file artifacts/aot-harness/AotHarnessApp
          artifacts/aot-harness/AotHarnessApp

      - name: Upload Harness NativeAOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-aot-harness-linux-x64
          path: artifacts/aot-harness/AotHarnessApp
