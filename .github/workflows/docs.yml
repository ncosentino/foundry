name: Documentation

# Standard GitHub-hosted runners, including windows-latest, are free and
# unlimited for this public repository; larger runners are intentionally excluded.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the generated site to Cloudflare Pages
        required: false
        default: false
        type: boolean

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs-layout:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation browser checks
        run: python -m pip install -r requirements-docs.txt -r scripts/tests/requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Render documentation
        run: python -m mkdocs build --strict
      - name: Check deferred-image geometry and footer targets
        run: python scripts/check-docs-layout.py
      - name: Capture actual-image review screenshots
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check-docs-layout.py --live-images
      - name: Retain bounded layout review evidence
        if: always() && hashFiles('artifacts/docs-layout/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: documentation-layout
          path: artifacts/docs-layout/
          retention-days: 1
          if-no-files-found: error

  docs:
    needs: docs-layout
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup exact .NET SDKs
        uses: ./.github/actions/setup-dotnet
        with:
          global-json-files: |
            global.json
            .github/dotnet/sdk-9/global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Test documentation scripts
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Restore
        run: dotnet restore src/NexusLabs.Foundry.slnx

      - name: Build release assemblies
        env:
          GITHUB_ENV: ${{ runner.temp }}/discard-docs-build-env-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_OUTPUT: ${{ runner.temp }}/discard-docs-build-output-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rm -f "$GITHUB_ENV" "$GITHUB_OUTPUT"
          dotnet build src/NexusLabs.Foundry.slnx --configuration Release --no-restore

      - name: Restore documentation tools
        run: dotnet tool restore

      - name: Generate development API documentation
        run: ./scripts/generate-api-docs.sh docs/api/dev --update-index

      - name: Generate API version catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate-api-catalog.py

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Restrict artifact to development-owned paths
        run: |
          rm -rf site/api/stable site/api/v*
          echo "Removed release-owned API documentation slices."

      - name: Build sitemap index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build-sitemap-index.py site

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-site
          path: site

  deploy:
    concurrency:
      group: foundry-documentation-publication
      cancel-in-progress: false
    needs: docs
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download documentation artifact
        uses: actions/download-artifact@v5
        with:
          name: foundry-site
          path: site

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Merge development documentation into gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-docs-merge.sh site main
